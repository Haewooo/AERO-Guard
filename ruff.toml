# Matches the style already in the codebase rather than imposing a new one.
line-length = 92
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI dependency defaults are declared in the signature
    "RUF001",  # the HMI and ICAO text legitimately use non-ASCII glyphs
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
"tests/*" = ["E501"]
